spring.application.name=hrmswebsiteproject-backend
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/hrms_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.frontend.url=http://localhost:5173
server.error.include-message=never
app.jwt.secret=
app.jwt.expiration-ms=86400000
logging.level.org.springframework.security=DEBUG
logging.level.com.hrms.backend.auth=DEBUG
hrms.document.storage-dir=${user.home}/hrms-documents
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


